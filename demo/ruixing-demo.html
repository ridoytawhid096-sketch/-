<style>
/* 布局：左侧导航 + 主工作区；手机宽度时导航移到底部 */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --surface-2:#EBEDE7; --fg:#1A1C19; --muted:#5A5F57; --line:#D8DBD2;
  --accent:#1D5BBF; --accent-soft:#E2EBFA; --on-accent:#FFFFFF;
  --good:#1B7546; --good-soft:#E1F2E8; --warn:#A04E0A; --warn-soft:#FBEBDC; --bad:#AE2A20; --bad-soft:#FBE6E3;
  --violet:#6446B4; --violet-soft:#ECE7FA; --shade:rgba(20,22,20,.45);
  --font-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-display:"Noto Serif SC","Songti SC","STSong",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111311; --surface:#1A1D1A; --surface-2:#242824; --fg:#E8EBE5; --muted:#A3A89F; --line:#323731;
  --accent:#86ADF3; --accent-soft:#1C2A45; --on-accent:#0D1830;
  --good:#72CD9B; --good-soft:#15301F; --warn:#F0A75E; --warn-soft:#3A2814; --bad:#F38B80; --bad-soft:#3C1D1A;
  --violet:#BCA7F2; --violet-soft:#2A2340; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111311; --surface:#1A1D1A; --surface-2:#242824; --fg:#E8EBE5; --muted:#A3A89F; --line:#323731;
  --accent:#86ADF3; --accent-soft:#1C2A45; --on-accent:#0D1830;
  --good:#72CD9B; --good-soft:#15301F; --warn:#F0A75E; --warn-soft:#3A2814; --bad:#F38B80; --bad-soft:#3C1D1A;
  --violet:#BCA7F2; --violet-soft:#2A2340; --shade:rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100%}
.side{width:228px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--font-display);font-size:22px;letter-spacing:.04em}
.brand span{font-size:12px;color:var(--muted)}
.rolebox{display:flex;flex-direction:column;gap:6px}
.rolebox label{font-size:12px;color:var(--muted);letter-spacing:.04em}
#nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px;padding:0 12px;border-radius:8px;border:0;background:transparent;text-align:left;cursor:pointer;font-size:15px}
.nv:hover{background:var(--surface-2)}
.nv[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nv .bd{min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
main{flex:1;min-width:0;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.demo-strip{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.ph h1{margin:0;font-family:var(--font-display);font-size:26px;text-wrap:balance}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em}
h2{margin:0;font-size:16px}
h3{margin:0;font-size:14px}
.muted{color:var(--muted);font-weight:400;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2 > *{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.btn{height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}

.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-align:left}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.blue{background:var(--accent-soft);color:var(--accent)}
.chip.green{background:var(--good-soft);color:var(--good)}
.chip.orange{background:var(--warn-soft);color:var(--warn)}
.chip.red{background:var(--bad-soft);color:var(--bad)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row:hover{background:var(--surface-2)}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rtitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:500}
.rsub{font-size:13px;color:var(--muted)}
.rdue{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rdue.bad{color:var(--bad);font-weight:700}
.rdue.warn{color:var(--warn);font-weight:500}

.empty{padding:16px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.kpi.dark .l,.kpi.dark .s{color:var(--bg);opacity:.75}
.v.bad{color:var(--bad)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font-weight:500;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
.t td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t .n{text-align:right;font-variant-numeric:tabular-nums}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t tr.total td{font-weight:700;border-top:2px solid var(--line)}
.cell-good{background:var(--accent-soft)}
.cell-best{background:var(--accent);color:var(--on-accent);font-weight:700}
.cell-bad{background:var(--bad-soft);color:var(--bad);font-weight:700}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;white-space:nowrap}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--fg);font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > label,.fld > .lb{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],input[type=search],input[type=tel],select,textarea{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);min-width:0}
textarea{height:auto;min-height:84px;padding:8px 10px;resize:vertical;width:100%}
.form{display:flex;flex-direction:column;gap:14px}
.form .fld input,.form .fld select{width:100%}
.form .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.form .two{grid-template-columns:minmax(0,1fr)}}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--fg)}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint.ok{color:var(--good)}
.err{font-size:13px;color:var(--bad);margin:0;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{height:36px;padding:0 14px;border:0;background:var(--surface);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.timeline{display:flex;flex-direction:column}
.ti{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ti:first-child{border-top:0}
.ti .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ti p{margin:2px 0 0}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:18px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fi{height:100%;background:var(--accent)}
.bar .fi.r{background:var(--bad)}
.bar .vv{text-align:right;font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:18px;height:200px;padding:0 6px;border-bottom:1px solid var(--line)}
.vb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:13px;font-variant-numeric:tabular-nums}
.vb .c{width:100%;max-width:120px;background:var(--accent);border-radius:4px 4px 0 0}
.vb .c.part{opacity:.55}
.vlabels{display:flex;gap:18px;padding:0 6px;font-size:13px;color:var(--muted)}
.vlabels div{flex:1;text-align:center}
.attn{display:flex;flex-direction:column;gap:8px}
.attn button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:8px;border:0;background:var(--surface-2);cursor:pointer}
.attn button.bad{background:var(--bad-soft)}
.attn button .go{font-size:12px;color:var(--accent)}
.attn button.bad .go{color:var(--bad)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{display:flex;justify-content:space-between;padding:2px 4px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.ocard:hover{border-color:var(--accent)}
.ocard b{font-size:15px}
.mapbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.mapbox svg{display:block;width:100%;height:auto}
.dot{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
.legend label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block}
.prog{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good)}
.cl{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none;font-size:14px}
.cl li{display:flex;gap:8px;align-items:center}
.ok-i{color:var(--good);font-weight:700}
.no-i{color:var(--bad);font-weight:700}
#modal{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--surface);color:var(--fg);border-radius:14px;width:100%;max-width:540px;max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg h2{font-size:18px}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px;line-height:1.6}
@media (max-width:820px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);gap:10px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .brand span,.rolebox label,.sidefoot{display:none}
  .rolebox select{max-width:58vw}
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:25;flex-direction:row;overflow-x:auto;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:4px}
  .nv{flex:1 0 auto;height:44px;font-size:14px;justify-content:center}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){.dlg{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><b>锐兴</b><span>新系统演示版</span></div>
    <div class="rolebox">
      <label for="role">切换演示身份</label>
      <select id="role"></select>
    </div>
    <nav id="nav" aria-label="主菜单"></nav>
    <div class="sidefoot">
      <div>数据全部为虚构的演示数据，"今天"按 2026 年 10 月 19 日计算。</div>
      <div>所有操作只保存在当前页面，刷新即恢复。</div>
      <button class="btn sm" data-act="reset" type="button">重置演示数据</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
/* ================= 基础工具 ================= */
const TODAY='2026-10-19';
const dn=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const nd=n=>new Date(n*864e5).toISOString().slice(0,10);
const T=dn(TODAY);
const addD=(s,k)=>nd(dn(s)+k);
const md=s=>{const p=s.split('-');return (+p[1])+'月'+(+p[2])+'日'};
const WK=['周日','周一','周二','周三','周四','周五','周六'];
const wk=s=>WK[new Date(dn(s)*864e5).getUTCDay()];
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Math.round(n).toLocaleString('zh-CN');
const yuan=n=>(n<0?'−¥':'¥')+Math.abs(Math.round(n)).toLocaleString('zh-CN');
const pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'—';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sum=(arr,f)=>arr.reduce((s,x)=>s+f(x),0);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=rng(20261019);
const pick=a=>a[Math.floor(R()*a.length)];
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
function wpick(o){let s=0;for(const k in o)s+=o[k];let r=R()*s;for(const k in o){r-=o[k];if(r<=0)return k}return Object.keys(o)[0]}

/* ================= 业务常量 ================= */
const CITIES=['绵阳','重庆','常州','成都','苏州','自贡'];
const CITY_W={绵阳:4.2,重庆:3,常州:1.6,成都:2,苏州:2,自贡:1};
const REFUND_P={绵阳:.3,重庆:.26,常州:.48,成都:.38,苏州:.32,自贡:.07};
const CHANNELS=['抖音','闲鱼','小红书','代发抖音小红书','转介绍','库存客户'];
const PAID=['抖音','闲鱼','小红书','代发抖音小红书'];
const CH_W={抖音:38,闲鱼:28,小红书:8,代发抖音小红书:4,转介绍:7,库存客户:15};
const CH_DEAL={抖音:1,闲鱼:.8,小红书:1.05,代发抖音小红书:.9,转介绍:1.5,库存客户:1.2};
const MONTHS=['2026-08','2026-09','2026-10'];
const MLABEL={'2026-08':'8 月','2026-09':'9 月','2026-10':'10 月（至 19 日）'};
const DISTRICTS={
  绵阳:[['涪城区',8,6],['游仙区',13.5,4.5],['高新区',4.5,9.5],['经开区',12,10.5],['科创园',16.5,8]],
  重庆:[['渝中区',9,7],['江北区',11.5,3.8],['南岸区',12.5,10.5],['沙坪坝区',4.5,5.5],['九龙坡区',5,10.5]],
  常州:[['天宁区',11,6.5],['钟楼区',7,7],['新北区',9,3],['武进区',10,11]],
  成都:[['锦江区',12,7.5],['武侯区',8,10],['高新区',11,11.5],['金牛区',7.5,4.5],['成华区',13.5,4.5]],
  苏州:[['姑苏区',7.5,7],['工业园区',13.5,7],['吴中区',9,11],['相城区',9,3]],
  自贡:[['自流井区',8,7],['大安区',12.5,5.5],['贡井区',4.5,8],['沿滩区',12,10.5]]

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function phoneGen(){return '1'+pick(['3','5','7','8','9'])+ri(0,9)+String(ri(0,99999999)).padStart(8,'0')}

function place(city,dname){

function nextDueInfo(L,status,fromDate){
  const arr=INTERVALS[status];if(!arr)return null;
  const k=L.followups.filter(f=>f.status===status).length;

}

function candidates(O){

    return {t,d:dist(t,L),subj,lvl,free,score:(subj?2:0)+(lvl?1:0)+(free?1.5:0)};
  }).sort((a,b)=>b.score-a.score||a.d-b.d);
}
function orderStatus(O){
  if(O.dealId)return '已成交';

  return '待匹配';
}
function makeLead(day,city){
  const age=T-dn(day);
  const ch=wpick(CH_W),owner=pick(OWN[city]),p=place(city),sur=pick(SURN);
  const L={id:'L'+(++lid),date:day,city,channel:ch,owner,...p,parent:sur+(R()<.78?'女士':'先生'),phone:uniqPhone(),
    child:{name:sur+pick(GIVEN),grade:pick(GRADES)},subject:pick(SUBJ),address:p.district+pick(COMMUNITIES)+ri(1,24)+'栋',
    followups:[],status:'新线索',reached:0,lastFollow:null,nextDue:null,dealIds:[],orderId:null};
  leads.push(L);LBY[L.id]=L;
  let r=0;
  if(age>=1||R()<.45){if(R()<.9){r=1;if(age>=1&&R()<.76){r=2;if(age>=2&&R()<.8)r=3}}}
  let f=dn(day);
  for(let i=1;i<=r;i++){if(i>1)f=Math.min(T,f+ri(1,3));L.followups.push({date:nd(f),status:STAGES[i-1],by:owner,text:pick(FTEXT[STAGES[i-1]])})}
  L.reached=r;
  if(r===3&&R()<.62*CH_DEAL[ch]){
    const x=f+ri(1,10);
    if(x<T){
      const D=makeDeal(L,nd(x));
      if(R()<REFUND_P[city]){const rd=x+ri(1,18);if(rd<=T){D.refund={date:nd(rd),amount:Math.round(D.fee*pick([1,1,.8,.6,.5])),reason:wpick(REASONS)};L.status='已退费';L.followups.push({date:nd(rd),status:'已退费',by:owner,text:'办理退费：'+D.refund.reason})}}
      const a=T-x;if(!D.refund){if(a>=8&&R()<.85)D.v7=true;if(a>=31&&R()<.85)D.v30=true}
      return;
    }
  }
  if(r===0){if(age>4)L.status='流失';return}
  L.status=STAGES[r-1];L.lastFollow=L.followups[r-1].date;
  if(age>24&&R()<.85){L.status='流失';L.followups.push({date:addD(L.lastFollow,ri(3,8)),status:'流失',by:owner,text:'家长已找到其他老师'});return}
  let due=dn(nextDueInfo(L,L.status,L.lastFollow).date);
  while(due<T-ri(0,2)&&R()<.72){L.followups.push({date:nd(due),status:L.status,by:owner,text:pick(FREPEAT)});L.lastFollow=nd(due);due=dn(nextDueInfo(L,L.status,L.lastFollow).date)}
  L.nextDue=nd(due);
}
function genAll(){
  R=rng(20261019);
  leads=[];deals=[];orders=[];teachers=[];costs=[];LBY={};DBY={};OBY={};TBY={};lid=0;did=0;oid=0;tid=0;usedPhones=new Set();
  for(const c of CITIES){const n=c==='绵阳'?36:ri(12,18);for(let i=0;i<n;i++)makeTeacher(c)}
  for(let n=dn('2026-08-01');n<=T;n++){
    const day=nd(n);
    for(const c of CITIES){
      const cnt=Math.round(CITY_W[c]*(.55+R()*.9)*(n<dn('2026-08-25')?.6:1)*(n===T?.5:1));
      for(let k=0;k<cnt;k++)makeLead(day,c);
    }
  }
  for(const L of leads){
    if((L.status==='已加微信'||L.status==='已报价')&&dn(L.date)>=T-16&&R()<.65){
      const O=makeOrder(L,{created:addD(L.lastFollow||L.date,0)});
      const st=wpick({待匹配:3,已推送:4,试课中:2,试课成功:1});
      if(st==='待匹配')continue;
      const cs=candidates(O).slice(0,6);
      const k=st==='已推送'?ri(1,3):ri(1,2);
      for(let i=0;i<k&&i<cs.length;i++){
        let s='已推送';
        if(st==='已推送')s=wpick({已推送:3,有意向:2,已拒绝:1});
        else if(i===0)s=st==='试课中'?'已约试课':'试课成功';
        else s='已拒绝';
        O.pushes.push({teacherId:cs[i].t.id,status:s,date:O.created});
      }
    }
  }
  for(const m of MONTHS)for(const c of CITIES)for(const ch of PAID){
    const base={闲鱼:250,抖音:60,小红书:18,代发抖音小红书:55}[ch]*CITY_W[c];
    let v=base*(.75+R()*.5)*(m==='2026-10'?19/31:1)*(m==='2026-08'?.8:1);
    if(c==='成都'&&ch==='闲鱼')v*=2.4;
    costs.push({month:m,city:c,channel:ch,amount:Math.round(v),by:R()<.5?'u8':'u9'});
  }
}

function tasks(uid){
  uid=uid||me().id;
  const mine=leads.filter(l=>l.owner===uid);
  const fresh=mine.filter(l=>l.status==='新线索').sort((a,b)=>a.date<b.date?-1:1);
  const due=mine.filter(l=>l.nextDue&&l.nextDue<=TODAY&&OPEN.includes(l.status)).sort((a,b)=>a.nextDue<b.nextDue?-1:1);
  const visits=[];
  for(const d of deals){

    const a=T-dn(d.date);

  return {fresh,due,visits};

/* ================= 数据分析 ================= */
function ctx(){
  const cities=S.city==='全部'?scopeCities():[S.city];
  return {cities,m:S.m,ok:x=>cities.includes(x.city)&&(!S.person||x.owner===S.person)};
}
function stats(c,f,m){
  f=f||(()=>true);m=m||c.m;
  const L=leads.filter(l=>c.ok(l)&&l.date.startsWith(m)&&f(l));
  const D=deals.filter(d=>c.ok(d)&&d.date.startsWith(m)&&f(d));
  const RF=deals.filter(d=>c.ok(d)&&d.refund&&d.refund.date.startsWith(m)&&f(d));
  const rev=sum(D,d=>d.fee),ra=sum(RF,d=>d.refund.amount);
  const cost=S.person?null:sum(costs.filter(x=>x.month===m&&c.cities.includes(x.city)&&f(x)),x=>x.amount);
  return {leads:L.length,inv:L.filter(l=>l.channel==='库存客户').length,deals:D.length,rev,rc:RF.length,ra,net:rev-ra,cost};
}
const roi=s=>s.cost?s.net/s.cost:null;
const roiTxt=v=>v==null?'—':v.toFixed(2);
function filterBar(){
  const sc=scopeCities();const owners=ownersIn(S.city==='全部'?sc:[S.city]);
  return `<div class="filters">
    <div class="fld"><label for="fm">月份</label><select id="fm" data-bind="m">${MONTHS.map(m=>`<option value="${m}" ${S.m===m?'selected':''}>${MLABEL[m]}</option>`).join('')}</select></div>
    <div class="fld"><label for="fc">城市</label><select id="fc" data-bind="city"><option value="全部">${me().role==='城市主管'?'我的辖区':'全部城市'}</option>${sc.map(c=>`<option ${S.city===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="fld"><label for="fp">人员</label><select id="fp" data-bind="person"><option value="">全部人员</option>${owners.map(s=>`<option value="${s.id}" ${S.person===s.id?'selected':''}>${s.name}（${s.role}）</option>`).join('')}</select></div>
  </div>`;
}
const TABS=[['overview','经营总览'],['channel','渠道与获客'],['conv','转化'],['refund','退费'],['supply','老师供给'],['staff','员工']];
function pageAnalytics(){
  const u=me();

  return `<div class="ph"><div><div class="eyebrow">${u.role==='城市主管'?'只显示你的辖区：'+u.cities.join('、'):'全公司'} · 同一个指标全系统只有一种算法</div><h1>数据分析</h1></div>${filterBar()}</div>
  <div class="tabs" role="tablist">${TABS.map(t=>`<button class="tab" role="tab" aria-selected="${S.tab===t[0]}" data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>
  ${body}`;
}
function kpi(l,v,s,cls){return `<div class="kpi ${cls||''}"><span class="l">${l}</span><span class="v ${cls==='bad'?'bad':''}">${v}</span>${s?`<span class="s">${s}</span>`:''}</div>`}
function groupRows(c,keys,keyOf){return keys.map(k=>({k,...stats(c,x=>keyOf(x)===k)}))}
function statTable(rows,first,showCost){
  const tot=rows.reduce((a,r)=>{for(const k of ['leads','deals','rev','rc','ra','net'])a[k]+=r[k];a.cost=(a.cost||0)+(r.cost||0);return a},{leads:0,deals:0,rev:0,rc:0,ra:0,net:0,cost:0});
  const cc=showCost&&!S.person;
  return `<div class="tw"><table class="t"><thead><tr><th>${first}</th><th class="n">新线索</th><th class="n">成交</th><th class="n">营收</th><th class="n">退费笔数</th><th class="n">退费额</th><th class="n">净营收</th><th class="n">退单率</th>${cc?'<th class="n">投入</th><th class="n">每单成本</th><th class="n">投产比</th>':''}</tr></thead><tbody>
  ${rows.sort((a,b)=>b.net-a.net).map(r=>{const rr=r.deals?r.rc/r.deals:0;const v=roi(r);return `<tr><td>${h(r.k)}</td><td class="n">${num(r.leads)}</td><td class="n">${num(r.deals)}</td><td class="n">${num(r.rev)}</td><td class="n">${r.rc}</td><td class="n">${num(r.ra)}</td><td class="n"><b>${num(r.net)}</b></td><td class="n ${rr>.4?'rdue bad':''}">${pct(r.rc,r.deals)}</td>${cc?`<td class="n">${r.cost?num(r.cost):'—'}</td><td class="n">${r.cost&&r.deals?num(r.cost/r.deals):'—'}</td><td class="n ${v!=null&&v<1?'rdue bad':''}">${roiTxt(v)}</td>`:''}</tr>`}).join('')}
  <tr class="total"><td>合计</td><td class="n">${num(tot.leads)}</td><td class="n">${num(tot.deals)}</td><td class="n">${num(tot.rev)}</td><td class="n">${tot.rc}</td><td class="n">${num(tot.ra)}</td><td class="n">${num(tot.net)}</td><td class="n">${pct(tot.rc,tot.deals)}</td>${cc?`<td class="n">${num(tot.cost)}</td><td class="n">${tot.deals?num(tot.cost/tot.deals):'—'}</td><td class="n">${tot.cost?(tot.net/tot.cost).toFixed(2):'—'}</td>`:''}</tr></tbody></table></div>`;
}
function attention(c){
  const items=[];const all=stats(c);const avg=all.deals?all.rc/all.deals:0;
  for(const city of c.cities){const s=stats(c,x=>x.city===city);if(s.deals>=8&&s.rc/s.deals>avg+.1)items.push({bad:1,t:`${city}退单率 ${pct(s.rc,s.deals)}，比平均高 ${((s.rc/s.deals-avg)*100).toFixed(0)} 个点`,go:'refund',g:'去看退费'})}
  if(!S.person)for(const city of c.cities)for(const ch of PAID){const s=stats(c,x=>x.city===city&&x.channel===ch);if(s.cost>=300&&s.net<s.cost)items.push({bad:1,t:`${city}${ch}投入 ${yuan(s.cost)}，净营收只有 ${yuan(s.net)}`,go:'channel',g:'去看渠道'})}
  for(const u of ownersIn(c.cities)){if(S.person&&u.id!==S.person)continue;const n=leads.filter(l=>l.owner===u.id&&l.nextDue&&l.nextDue<TODAY&&OPEN.includes(l.status)).length;if(n>=3)items.push({t:`${u.name}有 ${n} 位客户跟进已超期`,go:'staff',g:'去看员工'})}
  const wait=orders.filter(o=>c.cities.includes(o.city)&&orderStatus(o)==='待匹配'&&T-dn(o.created)>=3).length;
  if(wait)items.push({t:`${wait} 个订单超过 3 天还没推送老师`,go:'supply',g:'去看老师供给'});
  return items;
}

function staffRows(c,list){

let modalSubmit=null,modalLive=null;
function openModal(html,onSubmit,onLive){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;
  modalSubmit=onSubmit;modalLive=onLive||null;
  const f=m.querySelector('input,select,textarea');if(f)f.focus();
  if(modalLive)modalLive(m.querySelector('form'));
}
function closeModal(){const m=document.getElementById('modal');m.hidden=true;m.innerHTML='';modalSubmit=null;modalLive=null}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.tm);toast.tm=setTimeout(()=>{el.hidden=true},3200)}
const fv=(f,n)=>{const e=f.elements[n];return e?String(e.value).trim():''};
function setErr(f,t){const e=f.querySelector('.err');e.textContent=t||'';e.hidden=!t}
const foot=(ok)=>`<p class="err" hidden></p><div class="foot"><button type="button" class="btn" data-act="close">取消</button><button type="submit" class="btn primary">${ok}</button></div>`;

function mFollow(id){
  const L=LBY[id];const dealt=!OPEN.includes(L.status);
  const opts=dealt?['备注']:['已联系','已加微信','已报价','流失'];
  const def=dealt?'备注':(STAGES.includes(L.status)?L.status:'已联系');
  openModal(`<form class="form"><h2>记跟进 · ${h(L.parent)}</h2>
    <div class="fld"><label for="f-st">跟进结果</label><select id="f-st" name="status">${opts.map(o=>`<option ${o===def?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="fld"><label for="f-tx">跟进内容</label><textarea id="f-tx" name="text" placeholder="例如：家长希望周末上课，已发两位老师资料"></textarea></div>
    <p class="hint ok" id="f-next"></p>${foot('保存跟进')}</form>`,
  f=>{
    const st=fv(f,'status'),tx=fv(f,'text');
    if(!tx)return setErr(f,'请写一句跟进内容，方便下次接着聊。');
    if(st==='备注'){L.followups.push({date:TODAY,status:'备注',by:me().id,text:tx});closeModal();toast('已保存备注');return render()}
    const info=nextDueInfo(L,st,TODAY);
    L.followups.push({date:TODAY,status:st,by:me().id,text:tx});
    L.status=st;L.lastFollow=TODAY;
    if(STAGES.includes(st))L.reached=Math.max(L.reached,STAGES.indexOf(st)+1);
    L.nextDue=info?info.date:null;
    closeModal();toast(info?`已记录，下次跟进：${md(info.date)}（${info.n} 天后）`:'已记录，客户标记为流失，停止跟进');render();
  },
  f=>{const st=fv(f,'status');const el=f.querySelector('#f-next');
    if(st==='备注'){el.textContent='已成交或已退费的客户，只记备注，不再排跟进。';return}
    if(st==='流失'){el.textContent='标记流失后停止自动跟进。';return}
    const info=nextDueInfo(L,st,TODAY);el.textContent=`保存后，下次跟进自动排在 ${md(info.date)}（"${st}"第 ${info.k} 次跟进，间隔 ${info.n} 天）`;});
}
function mDeal(id,tId){

    <p class="hint">学生从这位家长名下选择，不会按同名自动匹配到别人家的孩子。同一次提交只会记一笔。</p>${foot('确认成交')}</form>`,
  f=>{
    if(S.ops[op])return;
    let stu=fv(f,'student');if(stu==='__new'){stu=fv(f,'newStudent');if(!stu)return setErr(f,'请填写新学生的姓名。')}

    const fee=fv(f,'fee');if(!/^\d+(\.\d{1,2})?$/.test(fee)||+fee<=0)return setErr(f,'信息费要填大于 0 的金额，最多两位小数。');
    const date=fv(f,'date');if(!date||date>TODAY)return setErr(f,'成交日期不能晚于今天。');
    S.ops[op]=1;
    makeDeal(L,date,{fee:+fee,teacherId:t,student:stu,by:me().id,text:`录入成交，信息费 ${yuan(+fee)}`});
    if(O)O.dealId=DBY['D'+did].id;
    closeModal();toast(`已录入成交 ${yuan(+fee)}，这位客户的跟进任务已停止`);render();
  },
  f=>{f.querySelector('#d-newbox').hidden=fv(f,'student')!=='__new'});
}

  },

    <div class="two"><div class="fld"><label for="n-g">孩子年级</label><select id="n-g" name="grade">${GRADES.map(g=>`<option>${g}</option>`).join('')}</select></div>
    <div class="fld"><label for="n-s">科目</label><select id="n-s" name="subject">${SUBJ.map(s=>`<option>${s}</option>`).join('')}</select></div></div>
    <div class="fld"><label for="n-ch">来源渠道</label><select id="n-ch" name="channel"><option value="">请选择（必填）</option>${CHANNELS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <p class="hint">手机号相同的客户系统会拦下，不会重复录入。演示可以试试已有号码：${mask(leads[5].phone)} 对应的完整号码 ${leads[5].phone}</p>${foot('保存客户')}</form>`,
  f=>{
    const p=fv(f,'parent'),ph=fv(f,'phone'),ch=fv(f,'channel');
    if(!p)return setErr(f,'请填写家长称呼。');
    if(!/^1\d{10}$/.test(ph))return setErr(f,'手机号要是 11 位数字。');
    const dup=leads.find(l=>l.phone===ph);
    if(dup)return setErr(f,`这个号码已经是客户（${dup.city}，负责人 ${SBY[dup.owner].name}），不能重复录入。如需接手请找主管转交。`);
    if(!ch)return setErr(f,'请选择来源渠道，渠道统计依赖这一项。');
    const city=fv(f,'city');const pl=place(city,fv(f,'district'));const sur=p[0];
    const L={id:'L'+(++lid),date:TODAY,city,channel:ch,owner:me().id,...pl,parent:p,phone:ph,child:{name:sur+'同学',grade:fv(f,'grade')},subject:fv(f,'subject'),
      address:pl.district+(fv(f,'addr')||''),followups:[],status:'新线索',reached:0,lastFollow:null,nextDue:null,dealIds:[],orderId:null};
    leads.push(L);LBY[L.id]=L;usedPhones.add(ph);closeModal();toast('已新建客户，已出现在今日待办的新线索里');go('cust',L.id);
  },
  f=>{const c=fv(f,'city');const sel=f.querySelector('#n-d');if(sel.dataset.c!==c){sel.dataset.c=c;sel.innerHTML=DISTRICTS[c].map(d=>`<option>${d[0]}</option>`).join('')}});
}
function mNewTeacher(){
  const cities=scopeCities();
  openModal(`<form class="form"><h2>录入老师</h2>
    <div class="two"><div class="fld"><label for="t-n">姓名</label><input id="t-n" name="name" type="text"></div>
    <div class="fld"><label for="t-p">手机号</label><input id="t-p" name="phone" type="tel" inputmode="numeric"></div></div>
    <div class="two"><div class="fld"><label for="t-c">城市</label><select id="t-c" name="city">${cities.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="fld"><label for="t-ty">老师类型</label><select id="t-ty" name="type"><option value="">请选择</option><option>在校大学生</option><option>专职教师</option><option>在职教师</option></select></div></div>
    <div class="fld"><span class="lb">科目</span><div class="checks">${SUBJ.slice(0,5).map(s=>`<label><input type="checkbox" name="subj" value="${s}">${s}</label>`).join('')}</div></div>
    <div class="fld"><span class="lb">学段</span><div class="checks">${LEVELS.map(s=>`<label><input type="checkbox" name="lv" value="${s}">${s}</label>`).join('')}</div></div>
    <div class="fld"><label for="t-a">详细地址</label><input id="t-a" name="addr" type="text" placeholder="小区或学校，不能只写城市"></div>
    <div class="note" id="t-c5"></div>${foot('保存老师')}</form>`,
  f=>{
    const n=fv(f,'name'),ph=fv(f,'phone');
    if(!n)return setErr(f,'请填写老师姓名。');
    if(!/^1\d{10}$/.test(ph))return setErr(f,'手机号要是 11 位数字。');
    const dup=teachers.find(t=>t.phone===ph);if(dup)return setErr(f,`这个手机号已经录过：${dup.name}（${dup.city}）。`);
    const subj=[...f.querySelectorAll('input[name=subj]:checked')].map(x=>x.value);const lv=[...f.querySelectorAll('input[name=lv]:checked')].map(x=>x.value);
    const ty=fv(f,'type'),addr=fv(f,'addr');
    const t=makeTeacher(fv(f,'city'),{name:n,phone:ph,type:ty||'在校大学生',hasType:!!ty,subjects:subj,levels:lv,hasAddress:!!addr,address:addr||'',status:'可接单',entered:TODAY,by:me().id});
    usedPhones.add(ph);closeModal();toast('老师已录入，资料完整度 '+completeness(t).filter(x=>x[1]).length+'/5');go('teacher',t.id);
  },
  f=>{const items=[['联系方式',/^1\d{10}$/.test(fv(f,'phone'))],['详细地址',!!fv(f,'addr')],['年级',!!f.querySelector('input[name=lv]:checked')],['科目',!!f.querySelector('input[name=subj]:checked')],['老师类型',!!fv(f,'type')]];
    const c=items.filter(x=>x[1]).length;f.querySelector('#t-c5').textContent=`资料完整度 ${c}/5`+(c<5?'，还缺：'+items.filter(x=>!x[1]).map(x=>x[0]).join('、'):'，可以派单');});
}

/* ================= 推送 ================= */
function doPush(o,leadId,tId){
  let O=o?OBY[o]:null;
  if(!O){const L=LBY[leadId];O=L.orderId?OBY[L.orderId]:makeOrder(L)}
  if(O.pushes.some(p=>p.teacherId===tId))return;
  O.pushes.push({teacherId:tId,status:'已推送',date:TODAY});
  toast(`已推送给 ${TBY[tId].name}，记录已保存`);render();
}

/* ================= 路由与渲染 ================= */
function go(page,id){S.hist.push([S.page,S.id]);S.page=page;S.id=id||null;S.mapSel=page==='map'?S.mapSel:S.mapSel;render();window.scrollTo(0,0)}
function navHtml(){
  const t=tasks();const n=t.fresh.length+t.due.length+t.visits.length;
  const cur=['cust'].includes(S.page)?'customers':S.page==='order'?'orders':S.page==='teacher'?'teachers':S.page;
  return NAV[S.uk].map(([k,l])=>`<button class="nv" data-act="nav" data-id="${k}" ${cur===k?'aria-current="page"':''}><span>${l}</span>${k==='todo'&&n?`<span class="bd">${n}</span>`:''}</button>`).join('');
}
function pageHtml(){
  const P={todo:pageTodo,customers:pageCustomers,cust:pageCust,orders:pageOrders,order:pageOrder,teachers:pageTeachers,teacher:pageTeacher,map:pageMap,
    analytics:pageAnalytics,team:pageTeam,staffdata:pageStaffData,mine:pageMine,accounts:pageAccounts};
  const f=P[S.page]||pageTodo;
  return `<div class="demo-strip">${chip('演示版','blue')}<span>当前身份：${h(DEMO[S.uk].label)} · 数据为虚构</span></div>`+f();
}
function render(){
  if(typeof document==='undefined')return;
  const ae=document.activeElement;const fid=ae&&ae.id&&ae.closest&&ae.closest('#main')?ae.id:null;let ss=null;try{ss=ae.selectionStart}catch(e){}
  document.getElementById('nav').innerHTML=navHtml();
  document.getElementById('main').innerHTML=`<div class="wrap">${pageHtml()}</div>`;
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(ss!=null)el.setSelectionRange(ss,ss)}catch(e){}}}
}
function switchRole(k){
  S.uk=k;S.page=NAV[k][0][0];S.id=null;S.hist=[];S.city='全部';S.person='';S.qOwner='';S.qCity='';S.mapSel=null;S.staffSel='';S.mapCity='';
  render();
}
if(typeof document!=='undefined'){
  const rs=document.getElementById('role');
  rs.innerHTML=Object.entries(DEMO).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
  rs.addEventListener('change',()=>switchRole(rs.value));
  document.addEventListener('click',e=>{
    const a=e.target.closest('[data-act]');if(!a)return;
    if(a.closest('#modal')&&a.dataset.act!=='close')return;
    const act=a.dataset.act,id=a.dataset.id;
    e.stopPropagation();
    switch(act){
      case 'nav':S.hist=[];S.page=id;S.id=null;S.staffSel='';render();window.scrollTo(0,0);break;
      case 'cust':go('cust',id);break;
      case 'order':go('order',id);break;
      case 'teacher':go('teacher',id);break;
      case 'back':{const p=S.hist.pop();if(p){S.page=p[0];S.id=p[1]}else{S.page=NAV[S.uk][0][0];S.id=null}render();break}
      case 'follow':mFollow(id);break;
      case 'deal':mDeal(id,a.dataset.t);break;
      case 'refund':mRefund(id);break;
      case 'visit':mVisit(id,a.dataset.k);break;
      case 'newlead':mNewLead();break;
      case 'newteacher':mNewTeacher();break;
      case 'toorder':{const L=LBY[id];const O=L.orderId?OBY[L.orderId]:makeOrder(L);if(!L.orderId)L.orderId=O.id;toast('已生成派单需求，按匹配度推荐老师');go('order',O.id);break}
      case 'push':doPush(a.dataset.o,a.dataset.lead,a.dataset.t);break;
      case 'pstat':{const O=OBY[id];const p=O.pushes[+a.dataset.i];p.status=a.dataset.s;p.date=TODAY;toast(`${TBY[p.teacherId].name}：${p.status}`);render();if(p.status==='试课成功')mDeal(O.leadId,p.teacherId);break}
      case 'tab':S.tab=id;if(S.page!=='analytics')S.page='analytics';render();break;
      case 'chview':S.chView=id;render();break;
      case 'mapsel':S.mapSel=[a.dataset.ty,id];render();break;
      case 'staffsel':S.staffSel=id;render();break;
      case 'acct':{const s=SBY[id];s.active=!s.active;toast(s.active?s.name+' 已启用':s.name+' 已停用，无法再登录');render();break}
      case 'close':closeModal();break;
      case 'reset':genAll();STAFF.forEach(s=>s.active=true);switchRole(S.uk);toast('演示数据已重置');break;
    }
  });
  document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modal').hidden)closeModal()});
  document.addEventListener('submit',e=>{e.preventDefault();if(modalSubmit)modalSubmit(e.target)});
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.closest('#modal')){if(modalLive)modalLive(t.closest('form'));return}
    if(t.dataset.bind&&t.type==='search'){S[t.dataset.bind]=t.value;render()}
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.closest('#modal')){if(modalLive)modalLive(t.closest('form'));return}
    if(t.dataset.layer){S.layers[t.dataset.layer]=t.checked;render();return}
    if(t.dataset.bind&&t.type!=='search'){S[t.dataset.bind]=t.value;if(t.dataset.bind==='city')S.person='';render()}
  });
  render();
}
</script>
