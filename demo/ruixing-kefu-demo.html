<style>

:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111311; --surface:#1A1D1A; --surface-2:#242824; --fg:#E8EBE5; --muted:#A3A89F; --line:#323731;
  --accent:#86ADF3; --accent-soft:#1C2A45; --on-accent:#0D1830;
  --good:#72CD9B; --good-soft:#15301F; --warn:#F0A75E; --warn-soft:#3A2814; --bad:#F38B80; --bad-soft:#3C1D1A;
  --violet:#BCA7F2; --violet-soft:#2A2340; --teal:#6FD0D3; --teal-soft:#123234; --shade:rgba(0,0,0,.6);
  --map-land:#20251F; --map-road:#2C322B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111311; --surface:#1A1D1A; --surface-2:#242824; --fg:#E8EBE5; --muted:#A3A89F; --line:#323731;
  --accent:#86ADF3; --accent-soft:#1C2A45; --on-accent:#0D1830;
  --good:#72CD9B; --good-soft:#15301F; --warn:#F0A75E; --warn-soft:#3A2814; --bad:#F38B80; --bad-soft:#3C1D1A;
  --violet:#BCA7F2; --violet-soft:#2A2340; --teal:#6FD0D3; --teal-soft:#123234; --shade:rgba(0,0,0,.6);
  --map-land:#20251F; --map-road:#2C322B; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100%}
.side{width:228px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--font-display);font-size:22px;letter-spacing:.04em}
.brand span{font-size:12px;color:var(--muted)}
.rolebox{display:flex;flex-direction:column;gap:6px}
.rolebox label{font-size:12px;color:var(--muted);letter-spacing:.04em}
#nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px;padding:0 12px;border-radius:8px;border:0;background:transparent;text-align:left;cursor:pointer;font-size:15px}
.nv:hover{background:var(--surface-2)}
.nv[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nv .bd{min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.nv .new{font-size:11px;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:0 6px;font-weight:500}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
main{flex:1;min-width:0;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.ph h1{margin:0;font-family:var(--font-display);font-size:26px;text-wrap:balance}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em}
h2{margin:0;font-size:16px}
h3{margin:0;font-size:14px}
.muted{color:var(--muted);font-weight:400;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}

.btns{display:flex;gap:8px;flex-wrap:wrap}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-align:left}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.blue{background:var(--accent-soft);color:var(--accent)}
.chip.green{background:var(--good-soft);color:var(--good)}
.chip.orange{background:var(--warn-soft);color:var(--warn)}
.chip.red{background:var(--bad-soft);color:var(--bad)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}

.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row.click{cursor:pointer}
.row.click:hover{background:var(--surface-2)}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rtitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:500}
.rsub{font-size:13px;color:var(--muted)}
.rdue{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.rdue.bad{color:var(--bad);font-weight:700}
.rdue.warn{color:var(--warn);font-weight:500}
.ract{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.row{flex-wrap:wrap}.rmain{flex-basis:calc(100% - 40px)}.rdue{order:3;text-align:left;padding-left:34px}.ract{order:4;margin-left:auto}}
.empty{padding:16px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font-weight:500;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
.t td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t .n{text-align:right;font-variant-numeric:tabular-nums}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;cursor:pointer;color:var(--muted);font-size:15px;white-space:nowrap}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--fg);font-weight:700}
.tab .c{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > label,.fld > .lb{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],input[type=search],input[type=tel],input[type=number],select,textarea{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);min-width:0}
textarea{height:auto;min-height:84px;padding:8px 10px;resize:vertical;width:100%}
.form{display:flex;flex-direction:column;gap:14px}
.form .fld input,.form .fld select{width:100%}
.form .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.form .two{grid-template-columns:minmax(0,1fr)}}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--fg)}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{font-size:13px;color:var(--bad);margin:0;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{height:36px;padding:0 12px;border:0;background:var(--surface);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.timeline{display:flex;flex-direction:column}
.ti{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ti:first-child{border-top:0}
.ti .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ti p{margin:2px 0 0}
.who{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px;line-height:1.6}
.note b{color:var(--fg)}
details.merge{font-size:13px;color:var(--muted)}
details.merge summary{cursor:pointer;color:var(--accent);width:max-content;max-width:100%}
details.merge > div{margin-top:8px}
/* 老师经营分类卡（沿用现系统的样子） */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cat{border:1px solid var(--line);border-top:3px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cat b{font-size:14px}
.cat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.cat .s{font-size:12px;color:var(--muted);line-height:1.4}
.cat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.cat.c-focus{border-top-color:var(--violet)} .cat.c-focus b{color:var(--violet)}
.cat.c-geo{border-top-color:var(--good)} .cat.c-geo b{color:var(--good)}
.cat.c-nogeo{border-top-color:var(--warn)} .cat.c-nogeo b{color:var(--warn)}
.cat.c-best{border-top-color:var(--teal)} .cat.c-best b{color:var(--teal)}
.cat.c-A{border-top-color:var(--bad)} .cat.c-B{border-top-color:var(--warn)} .cat.c-C{border-top-color:var(--violet)} .cat.c-D{border-top-color:var(--accent)} .cat.c-E{border-top-color:var(--muted)}
.qf{display:flex;gap:6px;align-items:flex-start;min-width:220px}
.qf textarea{min-height:40px;height:40px;font-size:13px}
/* 回访节点 */
.nodes{display:flex;gap:6px;flex-wrap:wrap}
.node{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:6px 8px;border-radius:8px;background:var(--surface-2);font-size:12px;color:var(--muted);border:0;cursor:default}
.node b{font-size:13px;color:var(--fg)}
.node.done{background:var(--good-soft);color:var(--good)}
.node.due{background:var(--bad-soft);color:var(--bad);cursor:pointer}
.node.due b{color:var(--bad)}
.node.cancel{text-decoration:line-through;opacity:.6}
/* 派单 */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{display:flex;justify-content:space-between;padding:2px 4px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.ocard:hover{border-color:var(--accent)}
.ocard b{font-size:15px}
.steps{display:flex;gap:4px;flex-wrap:wrap}

.steps span.no{background:var(--bad-soft);color:var(--bad)}
.prog{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--teal)}
.mapbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--map-land)}
.mapbox svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
.legend label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block}
.dist3{display:flex;gap:8px;flex-wrap:wrap}
.dist3 div{flex:1;min-width:76px;background:var(--surface-2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.dist3 b{font-size:18px;font-variant-numeric:tabular-nums}
.dist3 span{font-size:12px;color:var(--muted)}
#modal{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--surface);color:var(--fg);border-radius:14px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg.wide{max-width:820px}
.dlg h2{font-size:18px}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.back{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:14px;width:max-content}
@media (max-width:820px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;align-self:stretch;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);gap:10px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .brand span,.rolebox label,.sidefoot{display:none}
  .rolebox select{max-width:58vw}
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:25;flex-direction:row;overflow-x:auto;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:4px}
  .nv{flex:1 0 auto;height:44px;font-size:14px;justify-content:center}
  .nv .new{display:none}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

}
@media (prefers-reduced-motion:no-preference){.dlg{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<style>

<script>

const TODAY='2026-10-19';
const pad=n=>String(n).padStart(2,'0');
const dn=s=>{const[y,m,d]=s.slice(0,10).split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};

const fromMin=m=>nd(Math.floor(m/1440))+' '+pad(Math.floor(m%1440/60))+':'+pad(m%60);
let CLOCK=tmin('2026-10-19 10:30');
const now=()=>fromMin(++CLOCK);

function dur(fromTs){const d=CLOCK-tmin(fromTs);return Math.floor(d/1440)+'天'+Math.floor(d%1440/60)+'小时'}
function rel(s){const d=CLOCK-tmin(s);if(d<60)return Math.max(1,d)+' 分钟前';if(d<1440&&s.slice(0,10)===TODAY)return Math.floor(d/60)+' 小时前';const k=daysAgo(s);if(k===1)return '昨天 '+s.slice(11,16);return mdl(s)+(s.length>10?' '+s.slice(11,16):'')}
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= 演示数据 ================= */
let S;
function place(city){const d=pick(CITY_D[city]);return {district:d[0],x:clamp(d[1]+(R()-.5)*5,.6,19.4),y:clamp(d[2]+(R()-.5)*4,.6,13.4)}}

let orderSeq={};
function orderNo(city,date){const k=city+date;orderSeq[k]=(orderSeq[k]||0)+1;return city+'-'+date.replace(/-/g,'')+'-'+String(orderSeq[k]).padStart(3,'0')}
function seed(){
  R=rng(20261019);CLOCK=tmin('2026-10-19 10:30');orderSeq={};
  S={leads:[],teachers:[],orders:[],deals:[],orgs:[],log:[],changes:[],voids:[],done:[],seq:1};
  const id=p=>p+(S.seq++);
  /* 老师 */
  for(let i=0;i<170;i++){
    const city=i<135?'绵阳':'遵义',p=place(city);
    const g=wpick({success:34,approximate:40,pending:11,failed:2,empty:13});
    const lv=R()<.5?[pick(LEVELS)]:LEVELS.filter(()=>R()<.6);if(!lv.length)lv.push('初中');

    const basicMiss=R()<.33?(R()<.5?['地址','类型']:['类型']):[];const archMiss=basicMiss.length||R()<.25?['专业','学校','简历'].filter(()=>R()<.7):[];
    S.teachers.push({id:id('t'),name:pick(SURN)+pick(TGIVEN),phone:phone(),wechat:wxid(),sex:R()<.7?'女':'男',type:basicMiss.includes('类型')?'待补':pick(TTYPES),
      city,district:p.district,address:g==='empty'?'':p.district+pick(COMM)+'附近',x:hasLoc({geo:g})?p.x:null,y:hasLoc({geo:g})?p.y:null,geo:g,places:ri(1,3),

      hist:hasHist?{count:ri(1,4),fee:ri(3,14)*100,last:lastDeal}:null,notes:[],entered:addD(TODAY,-ri(5,400)),enteredBy:pick(['郑可','郑可','郑可','u1','u12','u4'])});

      source:R()<.05?'待补来源':pick(SOURCES.slice(0,4)),entry:'standard',inv:'',starred:false,cls:wpick({'':55,A:15,B:20,C:10}),follow:[],nextDue:null,lostReason:'',quote:null,transferAt:null,

    const D=mkDeal(L,L.kids[0].id,t.id,date+' '+pad(ri(10,20))+':'+pad(ri(0,59)),'self',{fee:ri(25,72)*10,hourly:ri(15,26)*10,weekly:ri(1,3)},L.owner,L.owner);

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let role='cs';
const me=()=>USERS[ROLE_UID[role]];
const isSup=()=>role==='sup';
const scopeIds=()=>isSup()?TEAM:[me().id];

const isInv=L=>L.entry==='inventory'&&L.inv==='pending';

const firstDue=L=>tmin(L.created)+12*60;
const lastTouch=L=>L.follow.length?L.follow[L.follow.length-1].at:L.created;

function missing(L){const m=[];if(!L.source||L.source==='待补来源')m.push('来源渠道');if(!L.subject)m.push('科目');if(!L.address)m.push('上课地址');else if(!hasLoc(L))m.push('定位');if(!L.wecom)m.push('所属微信');return m}

/* 三级推荐：地址+年级+科目 → 地址+年级 → 仅地址，5 公里内按距离 */
function nearTeachers(pt,opt){if(!pt||pt.x==null)return[];const seg=opt?opt.seg:level(kid0(pt).grade),subj=opt?opt.subjects:[pt.subject],tt=opt?opt.ttype:'';
  return S.teachers.filter(t=>t.city===pt.city&&t.status==='可接单'&&hasLoc(t)&&(!tt||t.type===tt)).map(t=>{const d=dist(t,pt);const g=!seg||t.levels.includes(seg);const s=!subj.length||subj.some(x=>t.subjects.includes(x));return{t,d,tier:g&&s?1:g?2:3}}).filter(x=>x.d<=5).sort((a,b)=>a.tier-b.tier||a.d-b.d)}
const TIER=['','地址+年级+科目全中','地址+年级','仅地址'];
function tStats(t){const ds=S.deals.filter(d=>d.teacherId===t.id&&!d.voided);let count=(t.hist?t.hist.count:0)+ds.length;let fee=(t.hist?t.hist.fee:0)+sum(ds.filter(d=>d.kind==='self'),d=>d.fee-(d.refund?d.refund.amount:0));
  let last=t.hist?t.hist.last:null;ds.forEach(d=>{if(!last||d.date>last)last=d.date});
  const band=!last?'':last>=addM(TODAY,-1)?'A':last>=addM(TODAY,-3)?'B':last>=addM(TODAY,-6)?'C':last>=addM(TODAY,-12)?'D':'E';
  const firstThisMonth=ds.length&&!t.hist&&ds.every(d=>d.date.startsWith(TODAY.slice(0,7)));
  return{count,fee,last,band,best:count>=2||fee>=1000,dealt:count>0,newThisMonth:firstThisMonth}}
const BAND_DESC={A:'≤1个月',B:'>1且≤3个月',C:'>3且≤6个月',D:'>6且≤12个月',E:'>12个月'};

/* 客户跟进任务（工作台的 11 个筛选） */
function followTasks(){const leads=myLeads().filter(L=>isLive(L)&&OPEN.includes(L.status));
  const first=L=>L.status==='新线索'&&!L.follow.length;
  const F={
    must:L=>!first(L)&&L.nextDue&&L.nextDue<=TODAY,
    all:L=>first(L)||!!L.nextDue,
    first:first,
    today:L=>!first(L)&&L.nextDue===TODAY,
    over:L=>!first(L)&&L.nextDue&&L.nextDue<TODAY,
    trans:L=>L.status==='转单',
    quote:L=>L.status==='已报价',
    future:L=>!first(L)&&L.nextDue&&L.nextDue>TODAY,
    n1:L=>!first(L)&&daysAgo(lastTouch(L))>=1,
    n3:L=>!first(L)&&daysAgo(lastTouch(L))>=3,
    n7:L=>!first(L)&&daysAgo(lastTouch(L))>=7};
  const out={};for(const k in F)out[k]=leads.filter(F[k]);return out}
const FCHIPS=[['must','今日必须完成'],['all','全部待处理'],['first','首次漏跟进'],['today','今日到期'],['over','已逾期'],['trans','转单未成交'],['quote','已报价'],['future','未来计划'],['n1','未跟进≥1天'],['n3','未跟进≥3天'],['n7','未跟进≥7天']];
/* 老客户回访任务：按成交单分组 */
function visitGroups(){const out=[];S.deals.forEach(D=>{if(D.voided)return;const L=LBY(D.leadId);if(!L||!scopeIds().includes(L.owner))return;
  const pend=D.visits.filter(v=>!v.done&&!v.cancelled);if(!pend.length)return;out.push({D,L,pend})});return out}
function visitBuckets(){const g=visitGroups();const all=g.flatMap(x=>x.pend.map(v=>({...x,v})));
  return{all,today:all.filter(x=>x.v.due===TODAY),over:all.filter(x=>x.v.due<TODAY),week:all.filter(x=>x.v.due>TODAY&&x.v.due<=addD(TODAY,7)),refund:all.filter(x=>x.v.type==='refund')}}
function careList(){const out={x:[],c:[]};myLeads().forEach(L=>{if(!leadDeals(L).length)return;L.kids.forEach(k=>{if(k.state==='已毕业')return;if(k.cur==='六年级')out.x.push({L,k});if(k.cur==='初三')out.c.push({L,k})})});return out}
function todoCount(){const f=followTasks(),v=visitBuckets();return new Set([...f.must,...f.first].map(L=>L.id)).size+v.today.length+v.over.length}
function log(type,ref,text){S.log.push({type,ref,text,by:me().id,at:now()})}
function addFollow(L,status,text,nextDays){const first=!L.follow.length;L.follow.push({at:now(),by:me().id,status,text});S.done.push({leadId:L.id,at:now(),by:me().id,status,text,first});
  if(status==='转单'&&L.status!=='转单')L.transferAt=now();if(OPEN.includes(status)){L.status=status;L.nextDue=nextDays==null?L.nextDue:addD(TODAY,nextDays)}
  log(first?'首次跟进':'跟进',L.id,L.parent+'：'+text);return first}

/* ================= 派单工具 ================= */
PAGES.dispatch=()=>{const v=view.d||(view.d={bucket:'all',raw:'',p:null,leadId:'',wx:me().dispatch||'',oid:'',mapAll:false});

  const transMon=myLeads().filter(L=>L.transferAt&&L.transferAt.startsWith(mon));const newTrans=transMon.filter(L=>L.created.startsWith(mon));
  const bk={all:trans,b2:trans.filter(L=>CLOCK-tmin(L.transferAt)<2880),b7:trans.filter(L=>{const d=CLOCK-tmin(L.transferAt);return d>=2880&&d<10080}),b8:trans.filter(L=>CLOCK-tmin(L.transferAt)>=10080)};
  const list=[...bk[v.bucket]].sort((a,b)=>a.transferAt<b.transferAt?-1:1);
  const myOrders=S.orders.filter(o=>o.status==='派单中'&&scopeIds().includes(o.by));
  const wkStart=addD(TODAY,-((new Date(dn(TODAY)*864e5).getUTCDay()+6)%7));
  const recs=S.orders.flatMap(o=>o.records).filter(r=>r.at.slice(0,10)>=wkStart);const succ=recs.filter(r=>r.outcome==='试课成功').length;
  const rr=S.orders.flatMap(o=>o.records).filter(r=>r.replyAt);const avgResp=rr.length?Math.round(sum(rr,r=>tmin(r.replyAt)-tmin(r.at))/rr.length):null;
  const O=v.oid?OBY(v.oid):null;const p=O||v.p;
  const near=O&&O.x!=null?nearTeachers(O,{seg:O.seg,subjects:O.subjects,ttype:O.ttype}):[];
  const tiers=[1,2,3].map(t=>near.filter(x=>x.tier===t));
  const wxOk=!!v.wx;const L=O&&O.leadId?LBY(O.leadId):(v.leadId?LBY(v.leadId):null);

  ${merged('<b>派单工具</b>整页保留：正式派单身份、派单工作看板（4 个数字 + 2 天内/2–7 天/7 天以上未成交）、三级放大派单（粘贴订单 → 识别定位 → 学生与老师位置 → 推荐老师 → 记录联系）。<br>改动三处：① 看板上的转单客户点“去派单”，订单原文自动带出来，订单和客户连上；② 推荐老师后“记录已联系”和老师回复结果都是一键；③ 试课成功直接录入成交，客服和派单人都记上。')}
  <section class="card"><div class="cardhead"><div><div class="eyebrow">正式派单身份</div><h2>本人老师派单微信</h2></div></div>
    <p class="hint">首次派单仍须显式选择；不会自动代选，也不会使用客户添加微信或招聘微信。</p>
    ${me().dispatch?`<div class="fld"><label for="dwx">本次派单使用的公司微信</label><select id="dwx"><option value="">请选择本次派单微信</option><option value="${me().dispatch}" ${v.wx===me().dispatch?'selected':''}>${h(WECOM[me().dispatch].name)}（${h(WECOM[me().dispatch].code)}）</option></select></div>`:'<div class="warnbox">暂未配置本人启用的老师派单微信，请联系老板配置。当前不能新增派单记录。</div>'}
    ${unsure('我猜现在 90 天只有 2 条派单记录，主要卡在这里：没配派单微信就记不了。新版建议：上线前给每个客服都配好；或者没配时也允许记录，只标“未用公司派单微信”。')}</section>
  <section class="card"><div class="cardhead"><h2>派单工作看板</h2><span class="muted">${mon} · 未成交数为当前状态</span></div>
    <div class="kpis"><div class="kpi"><span class="l">本月新增客户转单量</span><span class="v">${newTrans.length} 位</span></div><div class="kpi"><span class="l">本月新增客户当前转单未成交</span><span class="v">${newTrans.filter(L=>L.status==='转单').length} 位</span></div><div class="kpi"><span class="l">本月合计转单量</span><span class="v">${transMon.length} 位</span></div><div class="kpi"><span class="l">当前合计转单未成交</span><span class="v">${trans.length} 位</span></div></div>
    <div class="fchips">${[['all','全部',bk.all.length],['b2','2天内未成交',bk.b2.length],['b7','2–7天未成交',bk.b7.length],['b8','7天以上未成交',bk.b8.length]].map(([k,l,n])=>`<button type="button" data-dbk="${k}" aria-pressed="${v.bucket===k}">${l} · ${n}</button>`).join('')}</div>
    ${list.length?`<div class="tw"><table class="t"><thead><tr><th>序号</th><th>客户姓名</th><th>年级科目</th><th>转单时间</th><th>转单时长</th><th>派单进度</th>${isSup()?'<th>负责人</th>':''}<th>操作</th></tr></thead><tbody>${list.map((L,i)=>{const os=S.orders.filter(o=>o.leadId===L.id);const n=sum(os,o=>o.records.length);const dd=CLOCK-tmin(L.transferAt);return `<tr><td>${i+1}</td><td><button class="link" data-open="${L.id}" type="button">${h(L.parent)}</button></td><td>${h(kid0(L).grade)} · ${h(L.subject)}</td><td>${md(L.transferAt)}</td><td><span class="rdue ${dd>=10080?'bad':dd>=2880?'warn':''}">${dur(L.transferAt)}</span></td><td>${os.length?'已联系 '+n+' 位老师':'<span class="miss">还没派</span>'}</td>${isSup()?`<td>${owner(L.owner)}</td>`:''}<td><button class="btn sm primary" data-act="toDispatch" data-id="${L.id}" type="button">去派单</button></td></tr>`}).join('')}</tbody></table></div>`:empty('没有转单未成交的客户')}</section>
  <section class="card"><div class="cardhead"><div><h2>三级放大派单</h2><p class="hint">先找地址、年级、科目全中的老师，再依次放大到地址+年级、仅地址。</p></div><div class="btns"><button class="btn" data-act="dReset" type="button">清空重来</button></div></div>

  <div class="stepbox"><header><h2><i>1</i>粘贴订单并确认识别结果</h2><span class="muted">解析结果均可修改</span></header><div class="in two-pane">
    <div class="fld"><label for="draw">客服订单原文 ${L?chip('关联客户：'+L.parent,'teal'):''}</label><textarea id="draw" style="min-height:180px" placeholder="请粘贴订单原文；未识别城市时地图保持全国视图">${h(O?O.raw:v.raw)}</textarea>

      <div class="two"><div class="fld"><label for="dcity">城市（可选，可由地点自动判断）</label><select id="dcity"><option value="">自动识别城市</option>${Object.keys(CITY_D).map(c=>`<option ${p&&p.city===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="fld"><label for="dseg">年级段（可选）</label><select id="dseg"><option value="">不限年级</option>${LEVELS.map(l=>`<option ${p&&p.seg===l?'selected':''}>${l}</option>`).join('')}</select></div></div>
      <div class="fld"><label for="dtt">老师类型（可选）</label><select id="dtt"><option value="">不限类型</option>${TTYPES.map(l=>`<option ${p&&p.ttype===l?'selected':''}>${l}</option>`).join('')}</select></div>

  const pend=list.flatMap(G=>G.receipts.filter(r=>r.status==='待确认').map(r=>({G,r})));const renew=list.filter(g=>orgLeft(g)<=2);

/* ================= 我的数据（我的业绩 + 成交与退费统计） ================= */
function stats(uids,range){const mon=TODAY.slice(0,7);const inR=s=>range==='y'?s.slice(0,10)===addD(TODAY,-1):s.startsWith(mon);
  const leads=S.leads.filter(L=>uids.includes(L.owner)&&!L.voided);
  const nw=leads.filter(L=>isLive(L)&&inR(L.created)&&L.entry==='standard'||L.inv==='active'&&inR(L.created)&&uids.includes(L.owner));
  const withF=nw.filter(L=>L.follow.length);const ontime=withF.filter(L=>tmin(L.follow[0].at)<=firstDue(L)).length;
  const trans=leads.filter(L=>L.transferAt&&inR(L.transferAt)).length;
  const ds=S.deals.filter(d=>!d.voided&&uids.includes(d.by)&&inR(d.at));const fee=sum(ds,d=>d.fee);
  const rf=S.deals.filter(d=>!d.voided&&uids.includes(d.by)&&d.refund&&inR(d.refund.date));const rfa=sum(rf,d=>d.refund.amount);
  const disp=S.orders.flatMap(o=>o.records).filter(r=>uids.includes(r.by)&&inR(r.at)).length;
  return{nw:nw.length,ontime,withF:withF.length,trans,deals:ds.length,fee,rf:rf.length,rfa,disp,ds,rfl:rf}}
function progress(uids){const doneToday=S.done.filter(d=>uids.includes(d.by)).length;
  const leads=S.leads.filter(L=>uids.includes(L.owner)&&isLive(L)&&OPEN.includes(L.status)&&!L.voided);const due=leads.filter(L=>L.nextDue&&L.nextDue<=TODAY).length;const over=leads.filter(L=>L.nextDue&&L.nextDue<TODAY).length;
  return{should:due+doneToday,done:doneToday,left:due,over}}
PAGES.mine=()=>{const v=view.mine||(view.mine={range:'m',tab:'deal',q:''});const st=stats([me().id],v.range);const pg=progress([me().id]);

  const pendV=S.voids.filter(x=>x.by===me().id&&x.status==='待审批').length;

const M=document.getElementById('modal');
function openModal(html,onSubmit,wide){M.innerHTML=`<div class="dlg ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;M.hidden=false;const f=M.querySelector('form');if(f&&onSubmit)f.addEventListener('submit',e=>{e.preventDefault();const r=onSubmit(f);if(r!==false){closeModal();render()}});const first=M.querySelector('input,textarea,select,button');if(first)first.focus()}
function closeModal(){M.hidden=true;M.innerHTML=''}
const foot=t=>`<div class="foot"><button class="btn" type="button" data-act="close">取消</button><button class="btn primary" type="submit">${t}</button></div>`;
const fv=(f,n)=>{const e=f.elements[n];return e?String(e.value).trim():''};
const errOn=(f,t)=>{const e=f.querySelector('.err');e.textContent=t;e.hidden=false;return false};
let toastT;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,3200)}
function segHtml(name,opts,val){return `<div class="seg" data-seg="${name}">${opts.map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${k===val}">${l}</button>`).join('')}</div><input type="hidden" name="${name}" value="${val}">`}

function followModal(L){const next={新线索:'已联系',已联系:'已加微信',已加微信:'已报价',已报价:'已报价',转单:'转单'}[L.status]||'已联系';
  openModal(`<form class="form"><h2>跟进 · ${h(L.parent)}</h2><p class="hint">${h(kid0(L).name)} · ${h(kid0(L).grade)} · ${h(L.subject)} · 现在：${h(L.status)}${L.status==='新线索'&&!L.follow.length?' · 这是首次跟进':''}</p>
  ${unsure('跟进弹窗现系统的样子我没看到。这里只放 3 样：跟进后状态、这次聊了什么、下次什么时候跟进。')}
  <div class="fld"><span class="lb">跟进后的状态</span>${segHtml('st',['已联系','已加微信','已报价','转单'].map(s=>[s,s]),next)}</div>
  <div class="fld"><label for="f-t">这次聊了什么</label><textarea id="f-t" name="t" placeholder="例如：加上微信了，家长想要女老师，周六上午有空"></textarea></div>
  <div class="fld"><span class="lb">下次跟进</span>${segHtml('nd',[['1','明天'],['2','2 天后'],['3','3 天后'],['7','7 天后']],'2')}</div>
  <p class="err" hidden></p>${foot('保存跟进')}</form>`,f=>{const t=fv(f,'t');if(!t)return errOn(f,'写一句这次聊了什么，方便下次接着聊');const s=fv(f,'st');
    const first=addFollow(L,s,t,+fv(f,'nd'));toast(s==='转单'?'已转单，客户进入派单工具的工作看板':first?(tmin(L.follow[0].at)<=firstDue(L)?'首次跟进已记录，在 12 小时内 ✓':'首次跟进已记录（超过 12 小时）'):'已保存，'+mdl(L.nextDue)+' 再提醒你')})}
function transferModal(L){openModal(`<form class="form"><h2>转单 · ${h(L.parent)}</h2><p class="hint">家长同意找老师了，把需求交给派单。客户会进入派单工具的“派单工作看板”，从现在开始计转单时长。</p>
  <div class="fld"><label for="tr-t">订单原文（派单时直接用）</label><textarea id="tr-t" name="t">${h(orderText(L))}</textarea></div><p class="err" hidden></p>${foot('确认转单')}</form>`,f=>{
  addFollow(L,'转单','转单：'+fv(f,'t'),1);L.orderDraft=fv(f,'t');toast('已转单，可以去派单工具派单')})}
function relocateModal(L){openModal(`<form class="form"><h2>重新定位 · ${h(L.parent)}</h2><p class="hint">现在：${GEO[L.geo][0]}。改一下地址再搜，从结果里选对的那个。</p>
  <div class="fld"><label for="g-a">上课地址</label><div class="qf"><input id="g-a" name="a" type="text" value="${h(L.address)}" style="flex:1"><button class="btn" type="button" data-act="geoSearch">搜索</button></div></div>
  <div id="g-res" class="fld"></div><p class="err" hidden></p>${foot('用这个位置')}</form>`,f=>{const c=f.querySelector('input[name=pick]:checked');if(!c)return errOn(f,'先搜索，再选一个结果');
    const d=CITY_D[L.city].find(x=>x[0]===c.dataset.d)||CITY_D[L.city][0];L.address=c.value.replace(L.city,'');L.district=d[0];L.x=clamp(d[1]+(Math.random()-.5)*3,.6,19.4);L.y=clamp(d[2]+(Math.random()-.5)*3,.6,13.4);L.geo='success';
    S.changes.push({at:now(),by:me().id,leadId:L.id,what:'重新定位到 '+L.address});log('定位',L.id,L.parent+' 定位到 '+L.address);toast('定位成功，附近老师已更新')});
  M.querySelector('[data-act=geoSearch]').addEventListener('click',()=>{const a=M.querySelector('#g-a').value.trim();const comm=COMM.find(c=>a.includes(c))||pick(COMM);
    const res=CITY_D[L.city].slice(0,3).map((d,i)=>[d[0],d[0]+comm+(i?'（'+['','东门','二期'][i]+'）':'')]);
    M.querySelector('#g-res').innerHTML='<span class="lb">高德搜索结果</span>'+res.map((r,i)=>`<label class="checks"><span><input type="radio" name="pick" value="${h(L.city+r[1])}" data-d="${h(r[0])}" ${i===0?'checked':''}> ${h(L.city+r[1])}</span></label>`).join('')})}
function dealModal(L,tid,oid){const O=oid?OBY(oid):S.orders.find(o=>o.leadId===L.id&&o.status==='派单中');const cand=[...new Set([...(tid?[tid]:[]),...(O?O.records.map(r=>r.tid):[]),...nearTeachers(L).slice(0,6).map(x=>x.t.id)])];
  openModal(`<form class="form"><h2>录入成交 · ${h(L.parent)}</h2>
  <div class="two"><div class="fld"><label for="d-k">学生</label><select id="d-k" name="k">${L.kids.map(k=>`<option value="${k.id}">${h(k.name)} · ${h(k.grade)}</option>`).join('')}</select></div><div class="fld"><label for="d-t">老师</label><select id="d-t" name="t">${cand.length?cand.map(id=>`<option value="${id}" ${id===tid?'selected':''}>${h(TBY(id).name)}${O&&O.records.some(r=>r.tid===id)?'（派单联系过）':''}</option>`).join(''):'<option value="">附近没有老师</option>'}</select></div></div>

  <div data-kind="org" class="form" hidden><div class="two"><div class="fld"><label for="o-p">每次课收家长（元）</label><input id="o-p" name="op" type="number" value="200"></div><div class="fld"><label for="o-tp">每次课给老师（元）</label><input id="o-tp" name="otp" type="number" value="150"></div></div>
  <div class="two"><div class="fld"><label for="o-n">买了几次课</label><input id="o-n" name="on" type="number" value="20"></div><div class="fld"><label for="o-s">第一次上课</label><input id="o-s" name="os" type="date" value="${addD(TODAY,2)}"></div></div>
  <div class="fld"><span class="lb">谁收钱</span>${segHtml('opay',[['company','公司收'],['teacher','老师代收']],'company')}</div><div class="fld"><span class="lb">和老师怎么结算</span>${segHtml('oset',[['per_lesson','每次课'],['weekly','按周'],['monthly','按月']],'weekly')}</div></div>
  <p class="hint">客服记 ${owner(L.owner)}，派单记 ${owner(me().id)}。保存后生成订单号和第 7/30/90/180/365 天回访。提交一次就锁住，不会重复记。</p><p class="err" hidden></p>${foot('确认成交')}</form>`,f=>{
    const t=fv(f,'t');if(!t)return errOn(f,'选一位老师');const kind=fv(f,'kind');let D;
    if(kind==='self'){const fee=+fv(f,'f');if(!(fee>0)||fee%1)return errOn(f,'信息费要填正整数');D=mkDeal(L,fv(f,'k'),t,now(),'self',{fee,hourly:+fv(f,'h'),weekly:+fv(f,'w')},L.owner,me().id)}
    else{const n=+fv(f,'on'),p=+fv(f,'op');if(!(n>0)||!(p>0))return errOn(f,'课次和收费要填正数');D=mkDeal(L,fv(f,'k'),t,now(),'org',{fee:0},L.owner,me().id);mkOrg(D,{price:p,teacherPay:+fv(f,'otp'),total:n,pay:fv(f,'opay'),settle:fv(f,'oset'),start:fv(f,'os')||TODAY,time:wk(fv(f,'os')||TODAY)+' 19:00'})}
    L.status='已成交';L.nextDue=null;L.follow.push({at:now(),by:me().id,status:'已成交',text:'和 '+TBY(t).name+' 老师成交 '+D.no});

    log('成交',L.id,L.parent+' 成交 '+D.no);toast('成交已记录 '+D.no+'，回访计划已生成')});
  M.querySelector('[data-seg=kind]').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;M.querySelectorAll('[data-kind]').forEach(x=>x.hidden=x.dataset.kind!==b.dataset.v)})}
function refundModal(D){const L=LBY(D.leadId);openModal(`<form class="form"><h2>办理退费 · ${h(D.no)}</h2><p class="hint">${h(L.parent)} · 信息费 ${yuan(D.fee)} · ${D.date} 成交</p>
  <div class="two"><div class="fld"><label for="r-a">退多少（元）</label><input id="r-a" name="a" type="number" value="${D.fee}"></div><div class="fld"><label for="r-d">退费日期</label><input id="r-d" name="d" type="date" value="${TODAY}"></div></div>

  <div class="fld"><label for="r-r">原因</label><select id="r-r" name="r">${REFUND_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div>

    if(!(a>0)||a%1)return errOn(f,'退费金额要填正整数');if(a>D.fee)return errOn(f,'退费不能超过信息费 '+yuan(D.fee));if(!d||d<D.date)return errOn(f,'退费日期不能早于成交日期 '+D.date);if(d>TODAY)return errOn(f,'退费日期不能晚于今天');
    doRefund(D,{amount:a,date:d,side:fv(f,'side'),reason:fv(f,'r'),by:me().id,at:now()});L.follow.push({at:now(),by:me().id,status:'成交后退费',text:'退费 '+yuan(a)+'，'+fv(f,'r')});
    log('退费',L.id,D.no+' 退费 '+yuan(a));toast('退费已记录，已生成退费回访')})}
function lostModal(L){openModal(`<form class="form"><h2>标记流失 · ${h(L.parent)}</h2><div class="fld"><label for="l-r">原因</label><select id="l-r" name="r">${LOST_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div><div class="fld"><label for="l-n">补充（可不填）</label><textarea id="l-n" name="n"></textarea></div><p class="err" hidden></p>${foot('标记流失')}</form>`,f=>{

  <div class="fld"><label for="v-n">回访记录</label><textarea id="v-n" name="n" placeholder="例如：孩子很喜欢老师，家长想加一节英语"></textarea></div>

    if(L&&L.x!=null&&(!d||L.district===d[0])){O.x=L.x;O.y=L.y}else if(d){O.x=clamp(d[1]+(Math.random()-.5)*3,.6,19.4);O.y=clamp(d[2]+(Math.random()-.5)*3,.6,13.4)}else{O.x=null;O.y=null}
    v.oid=O.id;log('派单建单',O.id,'识别订单：'+p.place);render();toast('已推荐附近老师')},
  dOpen(el){const O=OBY(el.dataset.oid);view.d=Object.assign(view.d||{bucket:'all',wx:me().dispatch||'',mapAll:false},{oid:O.id,raw:'',p:null,leadId:O.leadId||''});prev=[];go('dispatch',true)},
  dContact(el){const v=view.d;const O=OBY(v.oid);if(!v.wx){toast('先选本次派单使用的公司微信');return}O.records.push({tid:el.dataset.tid,at:now(),by:me().id,wx:v.wx,replyAt:null,outcome:'待回复'});
    log('派单联系',O.id,'联系 '+TBY(el.dataset.tid).name);render();toast('已记录：'+TBY(el.dataset.tid).name+'，用'+WECOM[v.wx].name+'联系')}
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){if(a.closest('#modal'))closeModal();ACT[a.dataset.act](a);return}
  const sg=e.target.closest('[data-seg] button');if(sg){const w=sg.parentElement;w.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===sg));w.nextElementSibling.value=sg.dataset.v;return}
  const n=e.target.closest('[data-nav]');if(n){prev=[];go(n.dataset.nav,true);return}
  const o=e.target.closest('[data-open]');if(o){closeModal();go('cust:'+o.dataset.open);return}
  const t=e.target.closest('[data-topen]');if(t){closeModal();go('teacher:'+t.dataset.topen);return}
  const ds=e.target.closest('[data-dsub]');if(ds){readDispatchForm();const p=view.d.p;const s=ds.dataset.dsub;p.subjects=p.subjects.includes(s)?p.subjects.filter(x=>x!==s):[...p.subjects,s];render();return}
  const vt=e.target.closest('[data-vtab]');if(vt){view.vtab=vt.dataset.vtab;voidsModal();return}
  const map={tf:['todo','f'],ttab2:['todo','tab'],vb:['todo','vb'],vr:['todo','vr'],vdeal:['todo','vdeal'],care:['todo','care'],ccat:['cust','cat'],ccls:['cust','cls'],ttab:['t','tab'],tcat:['t','cat'],rtab:['t','rtab'],rprof:['t','prof'],rgeo:['t','geo'],dbk:['d','bucket'],mrange:['mine','range'],mtab:['mine','tab'],trange:['team','range'],mcity:['map','city']};
  for(const k in map){const el=e.target.closest('[data-'+k+']');if(el){const[vn,key]=map[k];let val=el.dataset[k];
    if(k==='tf'){view.todo.hist=false}if(k==='vb'){view.todo.vr='pending';view.todo.tab='visit'}if(k==='ccat'){view.cust.q=''}if(k==='mcity'){view.map.sel=null}
    view[vn][key]=val;render();return}}
  const th=e.target.closest('[data-thist]');if(th){view.todo.hist=th.dataset.thist==='1';render();return}
  const cd=e.target.closest('[data-cdays]');if(cd){const k=+cd.dataset.cdays;view.cust.days=view.cust.days===k?0:k;render();return}
  const dm=e.target.closest('[data-dmap]');if(dm){view.d.mapAll=dm.dataset.dmap==='1';render();return}
  const ms=e.target.closest('[data-sel]');if(ms){view.map.sel=ms.dataset.sel;render();return}
  const tm=e.target.closest('[data-teamown]');if(tm){view.cust={cat:'all',cls:'all',q:'',wx:'',st:'',days:0,owner:tm.dataset.teamown};prev=[];go('customers');return}
  if(e.target===M)closeModal();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!M.hidden)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('circle[data-sel]')){e.preventDefault();view.map.sel=e.target.dataset.sel;render()}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.matches('[data-outcome]')){const O=OBY(el.dataset.outcome);const r=O.records[+el.dataset.i];if(!r.replyAt&&el.value!=='待回复')r.replyAt=now();r.outcome=el.value;log('派单结果',O.id,TBY(r.tid).name+'：'+el.value);render();toast(el.value==='试课成功'?'试课成功！点“录入成交”':'已更新：'+el.value);return}
  if(el.matches('[data-cls]')){const L=LBY(el.dataset.cls);L.cls=el.value;S.changes.push({at:now(),by:me().id,leadId:L.id,what:'客户分级改为 '+(el.value||'未分级')});toast('分级已保存');return}
  const map={cst:['cust','st'],cown:['cust','owner'],cwx:['cust','wx'],tsort:['t','sort'],rtype:['t','type'],rst:['t','st'],vnode:['todo','vnode']};
  if(map[el.id]){view[map[el.id][0]][map[el.id][1]]=el.value;render();return}
  if(el.id==='dwx'){view.d.wx=el.value;render();return}
  if(el.id==='dlead'){view.d.leadId=el.value;if(view.d.oid){const O=OBY(view.d.oid);O.leadId=el.value||null}return}
  if(el.id==='reown'){const L=LBY(el.dataset.id);const from=L.owner;L.owner=el.value;L.wecom=USERS[L.owner].wecoms[0];S.changes.push({at:now(),by:me().id,leadId:L.id,what:'负责人 '+owner(from)+' → '+owner(L.owner)});render();toast('已交给 '+owner(L.owner)+'，记录了交接人和时间');return}
  if(el.matches('[data-mlayer]')){view.map[el.dataset.mlayer]=el.checked;render();return}
  if(el.id==='role'){role=el.value;prev=[];view={};page='todo';render()}});
let qT;document.addEventListener('input',e=>{const el=e.target;const map={tq:[page==='todo'?'todo':'t','q'],cq:['cust','q'],tq2:['t','q2'],mq:['mine','q']}[el.id];if(!map)return;clearTimeout(qT);qT=setTimeout(()=>{view[map[0]][map[1]]=el.value;render();const n=document.getElementById(el.id);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},250)});
document.addEventListener('submit',e=>{if(e.target.id==='tform'){e.preventDefault();teacherSave(e.target)}});
function teacherSave(f){const lv=[...f.querySelectorAll('[name=lv]:checked')].map(x=>x.value),sj=[...f.querySelectorAll('[name=sj]:checked')].map(x=>x.value);const er=f.querySelector('#tf-err');
  const bad=t=>{er.textContent=t;er.hidden=false};if(!fv(f,'n'))return bad('填一下姓名');if(!fv(f,'p'))return bad('填一下手机或微信');
  const city=fv(f,'c'),a=fv(f,'a'),d=CITY_D[city].find(x=>a.includes(x[0]));const basicMiss=[];if(!a)basicMiss.push('地址');if(fv(f,'ty')==='待补')basicMiss.push('类型');
  const t={id:'t'+(S.seq++),name:fv(f,'n'),phone:/^1\d{10}$/.test(fv(f,'p'))?fv(f,'p').slice(0,3)+'****'+fv(f,'p').slice(7):'',wechat:/^1\d{10}$/.test(fv(f,'p'))?'':fv(f,'p'),sex:'',type:fv(f,'ty'),city,district:d?d[0]:'',address:a,x:d?d[1]:null,y:d?d[2]:null,geo:d?'success':a?'failed':'empty',places:1,levels:lv.length?lv:['初中'],subjects:sj,status:'可接单',focus:false,basicMiss,archMiss:['专业','学校','简历'],companyWx:'',hist:null,notes:[],entered:TODAY,enteredBy:me().id};
  S.teachers.push(t);log('录入老师',t.id,t.name);toast(basicMiss.length?'已保存，进入“资料待补任务”':'已保存');go('teacher:'+t.id)}

seed();render();
</script>
